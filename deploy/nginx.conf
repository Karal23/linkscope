# Include in nginx's http context. Replace monitor.example.com and the certificate paths.
limit_req_zone $binary_remote_addr zone=linkscope_login:1m rate=6r/m;
limit_req_zone $binary_remote_addr zone=linkscope_api:4m rate=40r/s;
log_format linkscope '$time_iso8601 $request_method $uri $status $request_time';

server {
    listen 80;
    server_name monitor.example.com;
    access_log off;
    return 308 https://monitor.example.com$request_uri;
}

server {
    listen 443 ssl;
    server_name monitor.example.com;
    ssl_certificate /etc/letsencrypt/live/monitor.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/monitor.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    add_header Strict-Transport-Security "max-age=31536000" always;
    server_tokens off;

    access_log /var/log/nginx/linkscope.access.log linkscope;
    client_max_body_size 250k;
    client_body_timeout 10s;
    client_header_timeout 10s;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $http_host;
    proxy_read_timeout 20s;
    limit_req_status 429;

    location = /api/v1/login {
        limit_req zone=linkscope_login burst=5 nodelay;
        proxy_pass http://127.0.0.1:4188;
    }
    location ~ ^/api/v1/(state|history)$ {
        gzip on;
        gzip_proxied any;
        gzip_types application/json;
        gzip_min_length 1024;
        gzip_vary on;
        limit_req zone=linkscope_api burst=80 nodelay;
        proxy_pass http://127.0.0.1:4188;
    }
    location / {
        limit_req zone=linkscope_api burst=80 nodelay;
        proxy_pass http://127.0.0.1:4188;
    }
}
